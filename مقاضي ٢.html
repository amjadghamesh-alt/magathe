.top{display:flex;align-items:center;gap:12px;max-width:640px;margin:auto}
h1{margin:0;font-size:2.1rem;font-weight:800;color:var(--br);}
.sub{color:var(--mut);font-size:.9rem;flex:1}
.tagc{background:var(--tag);color:var(--tagk);font-weight:800;border-radius:6px 20px 20px 6px;padding:2px 14px 2px 10px;min-width:46px;text-align:center}
.tabs{display:flex;gap:8px;overflow-x:auto;padding:12px 0 10px;max-width:640px;margin:auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{flex:none;border:1px solid var(--ln);background:var(--sf);border-radius:999px;padding:7px 14px;font-weight:500;white-space:nowrap}
.tab.on{background:var(--br);color:var(--brk);border-color:var(--br);font-weight:700}
.tab b{background:var(--tag);color:var(--tagk);border-radius:999px;padding:0 7px;margin-right:6px;font-size:.8rem}
main{max-width:640px;margin:auto;padding:4px 16px 120px}
h2{font-size:1.15rem;margin:8px 0 10px}
ul{list-style:none;margin:0;padding:0;display:grid;gap:8px}
.row{display:flex;align-items:center;justify-content:space-between;gap:10px;background:var(--sf);border:1px solid var(--ln);border-radius:14px;padding:10px 14px;min-height:56px}
.row.on{background:var(--on);border-color:var(--br)}
.nm{font-weight:500;flex:1}
.row.on .nm{font-weight:700}
.ctl{display:flex;align-items:center;gap:6px}
.ctl button,.add{border:0;border-radius:10px;background:var(--br);color:var(--brk);font-weight:700}
.ctl button:not(.unit){width:36px;height:36px;font-size:1.3rem;line-height:1}
.ctl output{min-width:34px;text-align:center;font-weight:800;font-size:1.1rem}
.unit{background:var(--sf)!important;color:var(--ink)!important;border:1px dashed var(--br)!important;height:36px;padding:0 10px;font-size:.9rem}
.add{padding:8px 14px;background:transparent;color:var(--br);border:1.5px solid var(--br)}
.cu{display:flex;gap:8px;margin-top:14px}
.cu input,.ph input{flex:1;border:1px solid var(--ln);background:var(--sf);border-radius:12px;padding:11px 14px;min-width:0}
.btn{border:0;border-radius:12px;padding:12px 16px;font-weight:700;background:var(--br);color:var(--brk)}
.btn.alt{background:var(--sf);color:var(--ink);border:1px solid var(--ln)}
.bar{position:fixed;inset-inline:0;bottom:0;padding:12px 16px calc(12px + env(safe-area-inset-bottom,0px));background:linear-gradient(transparent,var(--bg) 35%)}
.bar .btn{display:block;width:100%;max-width:640px;margin:auto;font-size:1.05rem;padding:15px;box-shadow:0 6px 18px rgba(0,0,0,.18)}
.btn:disabled{opacity:.45;cursor:default}
#sheet{position:fixed;inset:0;z-index:9;background:rgba(0,0,0,.5);display:flex;align-items:flex-end;justify-content:center}
#sheet[hidden]{display:none}
.panel{background:var(--bg);width:100%;max-width:640px;max-height:92%;overflow:auto;border-radius:22px 22px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom,0px))}
.ph{display:flex;gap:8px;margin:14px 0 8px}
.acts{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.wa{background:#1fa855;color:#fff}
.sec{margin:12px 0 6px;font-weight:800;color:var(--br)}
.hd{display:flex;justify-content:space-between;align-items:center}
.hint{color:var(--mut);font-size:.82rem;margin:0 0 12px}
#toast{position:fixed;bottom:90px;left:50%;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:8px 18px;border-radius:999px;z-index:20;opacity:0;transition:opacity .2s;pointer-events:none}
#toast.s{opacity:1}
</style>
</head>
<body>
<header>
  <div class="top"><h1>مقاضي</h1><span class="sub">اختر أغراضك وأرسلها قائمةً جاهزة</span><span class="tagc" id="cnt">0</span></div>
  <nav class="tabs" id="tabs" aria-label="أقسام السوبر ماركت"></nav>
</header>
<main>
  <h2 id="st"></h2>
  <ul id="list"></ul>
  <div class="cu"><input id="cu" placeholder="غرض آخر غير موجود في القسم" maxlength="40"><button class="btn alt" data-act="addcu">إضافة</button></div>
</main>
<div class="bar"><button class="btn" id="open" data-act="open">مراجعة وإرسال القائمة</button></div>
<div id="sheet" hidden>
  <div class="panel" role="dialog" aria-label="قائمة المشتريات">
    <div class="hd"><h2 style="margin:0">قائمتك</h2><button class="btn alt" data-act="close">إغلاق</button></div>
    <div id="sum"></div>
    <div class="ph"><input id="phone" type="tel" inputmode="tel" dir="ltr" placeholder="رقم الجوال (اختياري) 9665XXXXXXXX"></div>
    <p class="hint">اترك الرقم فارغاً لاختيار جهة الاتصال بنفسك. أدخل الرقم بالصيغة الدولية بدون + أو أصفار.</p>
    <div class="acts">
      <button class="btn wa" data-act="wa">إرسال واتساب</button>
      <button class="btn" data-act="sms">إرسال رسالة نصية</button>
      <button class="btn alt" data-act="copy">نسخ القائمة</button>
      <button class="btn alt" data-act="clear">مسح الكل</button>
    </div>
  </div>
</div>
<div id="toast"></div>
<script>
const S=(id,n,ic,items)=>({id,n,ic,items});
const SECS=[
S("s0","خضار وفواكه","🥬",[["طماطم","كيلو"],["خيار","كيلو"],["بصل","كيلو"],["بطاطس","كيلو"],["جزر","كيلو"],["ليمون","كيلو"],["خس","حبة"],["بقدونس","حزمة"],["تفاح","كيلو"],["موز","كيلو"],["برتقال","كيلو"],["ثوم","كيس"]]),
S("s1","لحوم ودواجن وأسماك","🍗",[["دجاج كامل","حبة"],["صدور دجاج","كيلو"],["لحم غنم","كيلو"],["لحم بقر مفروم","كيلو"],["سمك","كيلو"],["روبيان","كيلو"],["نقانق","عبوة"]]),
S("s2","ألبان وبيض","🥛",[["حليب","عبوة"],["لبن","عبوة"],["زبادي","عبوة"],["جبنة","علبة"],["زبدة","علبة"],["بيض","كرتون"],["قشطة","علبة"],["لبنة","علبة"]]),
S("s3","مخبوزات","🍞",[["خبز","كيس"],["صامولي","كيس"],["توست","كيس"],["كرواسون","عبوة"],["كيك","علبة"]]),
S("s4","أرز وحبوب ومعلبات","🥫",[["أرز","كيس"],["معكرونة","كيس"],["عدس","كيس"],["حمص","كيس"],["فول معلب","علبة"],["تونة","علبة"],["صلصة طماطم","علبة"],["زيت طبخ","عبوة"],["سكر","كيس"],["ملح","عبوة"],["دقيق","كيس"],["بهارات","عبوة"]]),
S("s5","مشروبات","☕",[["ماء","كرتون"],["عصير","عبوة"],["شاي","علبة"],["قهوة","عبوة"],["نسكافيه","علبة"],["مشروب غازي","كرتون"]]),
S("s6","وجبات خفيفة","🍫",[["شيبس","كيس"],["شوكولاتة","حبة"],["بسكويت","عبوة"],["مكسرات","كيس"],["تمر","علبة"],["آيس كريم","علبة"]]),
S("s7","مجمدات","❄️",[["خضار مجمدة","كيس"],["بطاطس مقلية","كيس"],["سمبوسة","عبوة"],["ناجتس","عبوة"]]),
S("s8","منظفات ومستلزمات المنزل","🧼",[["سائل جلي","عبوة"],["مسحوق غسيل","عبوة"],["منعم أقمشة","عبوة"],["كلور","عبوة"],["مناديل","علبة"],["أكياس نفايات","عبوة"],["ورق تواليت","عبوة"],["إسفنج","عبوة"]]),
S("s9","عناية شخصية","🧴",[["شامبو","عبوة"],["صابون","عبوة"],["معجون أسنان","حبة"],["فرشاة أسنان","حبة"],["مزيل عرق","حبة"],["حفاضات","عبوة"]])
];
const UNITS=["حبة","كيلو","جرام","علبة","كيس","عبوة","كرتون","حزمة","لتر","دزينة"];
let st={sel:{},custom:{},phone:"",tab:"s0"},sheet=false;
try{const r=localStorage.getItem("maqadi");if(r)Object.assign(st,JSON.parse(r))}catch(e){}
const save=()=>{try{localStorage.setItem("maqadi",JSON.stringify(st))}catch(e){}};
const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const stepOf=u=>u==="كيلو"?0.5:u==="جرام"?250:1;
const fmt=n=>String(+n.toFixed(2));
const sec=id=>SECS.find(s=>s.id===id)||SECS[0];
const itemsOf=s=>s.items.concat(st.custom[s.id]||[]);
const keys=id=>Object.keys(st.sel).filter(k=>k.startsWith(id+"|"));
const nameOf=k=>k.slice(k.indexOf("|")+1);
function ctl(k,v){const e=esc(k);return `<span class="ctl"><button data-act="dec" data-k="${e}" aria-label="إنقاص">−</button><output>${fmt(v.q)}</output><button data-act="inc" data-k="${e}" aria-label="زيادة">+</button><button class="unit" data-act="unit" data-k="${e}" title="تغيير الوحدة">${v.u}</button></span>`}
function render(){
  const total=Object.keys(st.sel).length;
  $("#cnt").textContent=total;
  $("#open").textContent=total?`مراجعة وإرسال القائمة (${total})`:"اختر أغراضك أولاً";
  $("#open").disabled=!total;
  $("#tabs").innerHTML=SECS.map(s=>{const c=keys(s.id).length;return `<button class="tab${s.id===st.tab?" on":""}" data-act="tab" data-id="${s.id}">${s.ic} ${s.n}${c?`<b>${c}</b>`:""}</button>`}).join("");
  const s=sec(st.tab);
  $("#st").textContent=s.ic+" "+s.n;
  $("#list").innerHTML=itemsOf(s).map(([n,u])=>{const k=s.id+"|"+n,v=st.sel[k];
    return `<li class="row${v?" on":""}"><span class="nm">${esc(n)}</span>${v?ctl(k,v):`<button class="add" data-act="add" data-k="${esc(k)}" data-u="${u}">+ أضف</button>`}</li>`}).join("");
  if(sheet)renderSheet();
}
function renderSheet(){
  const h=SECS.map(s=>{const ks=keys(s.id);return ks.length?`<div class="sec">${s.ic} ${s.n}</div><ul>${ks.map(k=>`<li class="row on"><span class="nm">${esc(nameOf(k))}</span>${ctl(k,st.sel[k])}</li>`).join("")}</ul>`:""}).join("");
  $("#sum").innerHTML=h||"<p class='hint'>القائمة فارغة.</p>";
}
function msg(){
  let t="🛒 قائمة مقاضي\n";
  SECS.forEach(s=>{const ks=keys(s.id);if(ks.length)t+=`\n*${s.n}*\n`+ks.map(k=>`• ${nameOf(k)}: ${fmt(st.sel[k].q)} ${st.sel[k].u}`).join("\n")+"\n"});
  return t.trim();
}
const go=u=>{const a=document.createElement("a");a.href=u;a.target="_blank";a.rel="noopener";document.body.appendChild(a);a.click();a.remove()};
let tt;function toast(t){const e=$("#toast");e.textContent=t;e.classList.add("s");clearTimeout(tt);tt=setTimeout(()=>e.classList.remove("s"),1800)}
document.addEventListener("click",async e=>{
  const b=e.target.closest("[data-act]");if(!b)return;
  const a=b.dataset.act,k=b.dataset.k,v=k&&st.sel[k];
  if(a==="tab"){st.tab=b.dataset.id}
  else if(a==="add"){st.sel[k]={q:stepOf(b.dataset.u)>=1?1:1,u:b.dataset.u}}
  else if(a==="inc"&&v){v.q+=stepOf(v.u)}
  else if(a==="dec"&&v){v.q-=stepOf(v.u);if(v.q<=0)delete st.sel[k]}
  else if(a==="unit"&&v){v.u=UNITS[(UNITS.indexOf(v.u)+1)%UNITS.length]}
  else if(a==="addcu"){const i=$("#cu"),n=i.value.replace(/\|/g,"").trim();if(!n)return;
    (st.custom[st.tab]=st.custom[st.tab]||[]).push([n,"حبة"]);st.sel[st.tab+"|"+n]={q:1,u:"حبة"};i.value=""}
  else if(a==="open"){sheet=true;$("#sheet").hidden=false}
  else if(a==="close"){sheet=false;$("#sheet").hidden=true}
  else if(a==="clear"){if(!confirm("مسح كل الأغراض المختارة؟"))return;st.sel={};sheet=false;$("#sheet").hidden=true}
  else if(a==="copy"){try{await navigator.clipboard.writeText(msg());toast("تم نسخ القائمة")}catch(x){toast("تعذر النسخ")}return}
  else if(a==="wa"||a==="sms"){
    if(!Object.keys(st.sel).length)return;
    const p=st.phone.replace(/\D/g,""),t=encodeURIComponent(msg());
    if(a==="wa")go(`https://wa.me/${p}?text=${t}`);
    else go(`sms:${p}${/iPhone|iPad|iPod/.test(navigator.userAgent)?"&":"?"}body=${t}`);
    return}
  save();render();
});
$("#cu").addEventListener("keydown",e=>{if(e.key==="Enter")document.querySelector('[data-act="addcu"]').click()});
$("#phone").value=st.phone||"";
$("#phone").addEventListener("input",e=>{st.phone=e.target.value;save()});
render();
</script>
</body>
</html>
